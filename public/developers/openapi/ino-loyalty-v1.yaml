  /api/v1/{channelCode}/order.loyalty:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: orderLoyalty
      tags: [Orders]
      summary: Get an order's net loyalty summary
      description: |
        Operation value `order.loyalty` of `POST /api/v1/{channelCode}/{operation}`.

        Returns the order's **current, net** loyalty result — the sale plus every return so far: status, points earned and
        spent, loyalty discount, voucher used, each campaign's net contribution, vouchers issued, returns, and pending points
        (when the program holds points until the return period ends).

        `Version` only grows — ignore a summary whose version is lower than one you already stored. Returns the standard
        envelope; the summary is in `Data`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderLoyaltyRequest"
            example:
              requestId: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a
