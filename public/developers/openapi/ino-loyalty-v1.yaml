                discountReversal: 0
                voucherReinstated: false
                items:
                  - { rowNumber: 2, quantity: 1 }
                orderStatus: PARTIALLY_RETURNED
                netEarnPoints: 89
                netSpendPoints: 0
                netLoyaltyDiscount: 13.35
      responses:
        "2XX":
          description: Acknowledge the delivery. Any other status (or a timeout after 10 seconds) is retried; `410 Gone` suspends the subscription.

