    post:
      operationId: voucherRedeem
      tags: [Vouchers]
      summary: Redeem a voucher against an order
      description: |
        Operation value `voucher.redeem` of `POST /api/v1/{channelCode}/{operation}`.

        Redeems a voucher against an order. A redemption publishes a `voucher.redeemed` event so that other channels and
        stores can update any cached copy of the voucher.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherRedeemRequest"
            example:
              requestId: 8f9a0b1c-2d3e-4f4a-9b5c-6d7e8f9a0b1c
              code: SAVE10-7KQ2P
              orderNumber: ORD-10482
      responses:
        "200":
          description: Redemption result.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherRedeemResponse"
              example:
                httpStatus: 200
                message: Success
                code: SAVE10-7KQ2P
                status: REDEEMED
        "400": { $ref: "#/components/responses/BadRequest" }
