              example:
                ResponseCode: SUCCESS
                ResponseCodeValue: 1200
                ResponseMessage: Success
                RequestId: 1b0c9d8e-7f6a-45ee-dddc-cbbaa9988777
                Data: { jobId: 0a1b2c3d-0000-4000-8000-000000000007 }
                Warnings: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/{channelCode}/jobs/{jobId}/status:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/jobId"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: getJobStatus
      tags: [Jobs]
      summary: Check a job's status
      description: |
        Returns the job's status and progress. Send `{}` as the body. A job id that does not exist, or belongs to a
        different channel, returns `NOT_FOUND`.
      requestBody:
        $ref: "#/components/requestBodies/EmptyObject"
      responses:
        "200":
          description: Job status.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      Data:
                        $ref: "#/components/schemas/JobStatus"
              example:
                ResponseCode: SUCCESS
                ResponseCodeValue: 1200
                ResponseMessage: Success
                RequestId: 2c1d0e9f-8a7b-46ff-eeed-dccbbaa99888
                Data:
                  jobId: 0a1b2c3d-0000-4000-8000-000000000007
                  status: READY
                  jobType: point_load
                  totalRows: 1200
                  processedRows: 1200
                  successRows: 1198
                  failedRows: 2
                  rowErrorSamples:
                    - "Row 214: customer not found."
                    - "Row 977: amount is not a number."
                  errorMessage: null
                  result:
                    available: true
                    expiresAt: "2026-11-10T14:35:00+00:00"
                    url: /api/v1/MODERN_ECOM/jobs/0a1b2c3d-0000-4000-8000-000000000007/result
                  createdAt: "2026-11-03T14:30:00+00:00"
                  startedAt: "2026-11-03T14:30:05+00:00"
                  finishedAt: "2026-11-03T14:34:40+00:00"
                Warnings: []
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/{channelCode}/jobs/{jobId}/result:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/jobId"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: getJobResult
      tags: [Jobs]
      summary: Download a job's result
      description: |
        Returns the job's result. Send `{}` as the body.

        - JSON summary jobs (for example `point_load`, `point_correction_file_import`) return the summary object in `Data`.
        - File-result jobs (for example `segment_export`, `transaction_file_import`) return the raw file
          (`Content-Type: text/csv`) as the response body.

        Calling this before the job is `READY` returns a validation error (`PARAMETER_ERROR`). Results are retained for a
        limited time (`result.expiresAt` in the status response); after that this endpoint returns `NOT_FOUND`.
      requestBody:
        $ref: "#/components/requestBodies/EmptyObject"
      responses:
        "200":
          description: The job result — a JSON summary in the standard envelope, or a CSV file.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
