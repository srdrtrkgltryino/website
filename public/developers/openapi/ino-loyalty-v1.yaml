  # ------------------------------------------------------------------ Webhooks (REST resource)

  /api/v1/{channelCode}/webhooks/subscriptions:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: createWebhookSubscription
      tags: [Webhooks]
      summary: Create a subscription
      description: |
        Creates a subscription and returns **201** with an absolute `Location` header and the signing `secret` — shown
        **once**; store it immediately. Calling it again with the same `url` returns **200** with the existing
        subscription and no secret.

        - `eventTypes` omitted or `[]` means **all** public event types.
        - Unknown event types are accepted (to keep older integrations working) but reported in `warnings` — a misspelled
          type would never fire.
        - `url` must use `https`. Addresses that resolve to private, loopback or link-local networks are refused at
          delivery time.
        - `originChannels` / `storeIds` limit the subscription to events caused by those channels or stores. The store
          filter keeps the store's own events and events that belong to no store.

        Requires the `webhooks` permission on a managed API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCreateRequest"
            example:
              url: https://hooks.example.com/ino-loyalty
              eventTypes: [points.earned, voucher.issued, transaction.returned]
      responses:
        "201":
          description: Subscription created. The secret is included only in this response.
          headers:
            Location:
              description: Absolute URL of the new subscription.
              schema: { type: string, format: uri }
              example: https://loyalty.example.com/api/v1/MODERN_ECOM/webhooks/subscriptions/0f1e2d3c-4b5a-4968-8776-655443322110
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCreateEnvelope"
              example:
                ResponseCode: SUCCESS
                ResponseCodeValue: 1200
                ResponseMessage: Success
                RequestId: 3f2e1d0c-9b8a-4776-8554-433221100fed
                Data:
                  subscription:
                    id: 0f1e2d3c-4b5a-4968-8776-655443322110
                    url: https://hooks.example.com/ino-loyalty
                    eventTypes: [points.earned, voucher.issued, transaction.returned]
                    status: ACTIVE
                    state: ACTIVE
                    createdAt: "2026-11-03T14:30:00+00:00"
                    originChannels: []
                    storeIds: []
                  secret: whsec_examplesecret
                  warnings: []
                Warnings: []
        "200":
          description: A subscription with this URL already exists; it is returned without a secret.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCreateEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      operationId: listWebhookSubscriptions
      tags: [Webhooks]
      summary: List subscriptions
      description: |
        Lists your channel's subscriptions. The secret is **never** included. Signed over an empty body.
      responses:
        "200":
          description: Your subscriptions.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionListEnvelope"
