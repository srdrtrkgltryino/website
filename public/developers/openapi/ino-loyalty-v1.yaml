  # ------------------------------------------------------------------ Events

  /api/v1/{channelCode}/events:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    get:
      operationId: getEvents
      tags: [Events]
      summary: Read the event stream
      description: |
        Pull the same events that webhooks deliver, in the same CloudEvents envelope (public event types only). Signed like
        any channel call — for a `GET` the signature is computed over an empty body. A managed API key needs the `events`
        permission.

        - The **first call** (no `after`) returns no events and the cursor at the end of the stream: load your cache first,
          then poll with the returned `cursor`.
        - Each response returns the next `cursor` and `hasMore` — call again at once when `hasMore` is `true`.
        - Order follows committed transactions: no event is skipped, even when a slow transaction commits late.
        - `store` returns that store's events plus events that belong to no store (campaigns, members).
        - Events are kept **30 days**. An older cursor gets **410 `CURSOR_EXPIRED`**: reload the cache and start again
          without `after`.

        Events caused by a channel request carry `originchannel` (and, when known, `storeid`) so a till can ignore its own
        changes.
      parameters:
        - name: after
          in: query
          required: false
          description: Opaque cursor from the previous response. Omit on the first call.
          schema: { type: string }
          example: djE6OTEyMzQ1OjE6MTc2MjE4MDIwMA
        - name: types
          in: query
          required: false
          description: Comma-separated event types to return (default all public types). An unknown type returns 400.
          schema: { type: string }
          example: campaign.changed,voucher.redeemed,member.updated
        - name: store
          in: query
          required: false
          description: Store code. Returns that store's events plus events that belong to no store.
          schema: { type: string }
          example: NYC-014
        - name: limit
          in: query
          required: false
          description: Maximum number of events to return.
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: A page of events.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      Data:
                        $ref: "#/components/schemas/EventPage"
              example:
                ResponseCode: SUCCESS
                ResponseCodeValue: 1200
                ResponseMessage: Success
                RequestId: 9f8a7b6c-5d4e-43cc-bbba-a99887766555
                Data:
                  events:
                    - id: 5d2c9e8a-0000-4000-8000-0000000000aa
                      source: ino-loyalty-api
                      type: voucher.redeemed
                      specversion: "1.0"
                      time: "2026-11-03T14:30:00+00:00"
                      subject: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
                      dataversion: 1
                      originchannel: MODERN_ECOM
                      data:
                        voucherId: d1e2f3a4-0000-4000-8000-000000000004
                        code: SAVE10-7KQ2P
                        voucherType: AMOUNT
                        value: 10.00
                        customerId: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
                        orderNumber: ORD-10482
                        partnerReference: null
                        location: null
                        amount: 10.00
                        redeemedAt: "2026-11-03T14:30:00+00:00"
                  cursor: djE6OTEyMzU4OjM6MTc2MjE4MDI2MA
                  hasMore: false
                Warnings: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410":
          description: The cursor is older than the event retention (`CURSOR_EXPIRED`). Reload your cache and start again without `after`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ResponseCode: { type: string, const: CURSOR_EXPIRED }
                  ResponseMessage: { type: string }
                  RequestId: { type: string }
              example:
                ResponseCode: CURSOR_EXPIRED
                ResponseMessage: The cursor is older than the event retention. Reload your cache and start again without 'after'.
                RequestId: 0a9b8c7d-6e5f-44dd-cccb-baa998877666
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/meta/events:
    get:
      operationId: getEventCatalog
      tags: [Events]
      summary: Get the event catalog
      description: |
        The machine-readable event catalog: every event type with its version, group, title, description, an example body
        and the JSON Schema of its `data`. **No authentication needed.** This response is not wrapped in the standard
        envelope.
      security: []
      responses:
        "200":
          description: The event catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCatalog"
              example:
                events:
                  - type: points.earned
                    version: 1
                    group: Points
                    title: Points earned
                    description: A campaign gave points to a member. One event per campaign award.
                    visibility: public
                    example:
                      id: 5d2c9e8a-0000-4000-8000-0000000000aa
                      source: ino-loyalty-api
                      type: points.earned
                      specversion: "1.0"
                      time: "2026-11-03T14:30:00+00:00"
                      subject: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
                      dataversion: 1
                      data:
                        customerId: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
                        transactionId: b3a1d0c4-1e2f-4a5b-8c9d-0e1f2a3b4c5d
                        points: 120
                        campaignCode: WELCOME10
                        expiresAt: "2027-11-03T14:30:00+00:00"
                    dataSchema:
                      type: object
                      properties:
                        customerId: { type: [string, "null"] }
                        transactionId: { type: string }
                        points: { type: number }
                        campaignCode: { type: [string, "null"] }
                        expiresAt: { type: [string, "null"], format: date-time }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ------------------------------------------------------------------ Jobs

  /api/v1/{channelCode}/jobs/{jobType}:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
      - name: jobType
        in: path
        required: true
        description: |
          The job type, for example `point_load`, `point_correction_file_import`, `segment_export` or
          `transaction_file_import`. The job types available to you are listed in your onboarding material. An unknown
          type returns `NOT_FOUND`.
        schema: { type: string }
        example: point_load
    post:
      operationId: submitJob
      tags: [Jobs]
      summary: Submit a job
      description: |
        Submits a bulk job. The request body is specific to `jobType` and must be valid JSON. Returns **202** with the job id
        and a `Location` header pointing to the status endpoint. Requires the `jobs` permission on a managed API key.
      requestBody:
        required: true
        description: Job-type-specific JSON body.
        content:
          application/json:
            schema:
              type: object
              description: Job-type-specific parameters.
      responses:
        "202":
          description: The job was accepted and will be processed in the background.
          headers:
            Location:
              description: Relative URL of the job's status endpoint.
              schema: { type: string }
              example: /api/v1/MODERN_ECOM/jobs/0a1b2c3d-0000-4000-8000-000000000007/status
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                allOf:
