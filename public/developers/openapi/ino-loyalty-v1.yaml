openapi: 3.1.0

info:
  title: Ino Loyalty API
  version: "1.0"
  summary: Real-time loyalty operations, webhooks, event stream and bulk jobs for point-of-sale, e-commerce and call-center channels.
  description: |
    The Ino Loyalty API lets your point-of-sale, e-commerce and call-center systems earn and spend points,
    price carts with campaigns, manage members and vouchers, process returns, and receive loyalty events.

    ## Base URL and versioning

    ```
    POST https://{host}/api/v1/{channelCode}/{operation}
    ```

    - `{host}` is your Ino Loyalty API host, provided during onboarding.
    - `channelCode` identifies your integration (for example `MODERN_ECOM`). It is provisioned by Ino Loyalty and
      tied to your credentials and field mapping.
    - `v1` is the current, stable version. We make only additive changes within `v1` (new optional fields, new
      operations). A breaking change ships as `/api/v2/...` while `v1` keeps working, and we announce the sunset
      timeline before retiring a version.

    **About the operation paths.** All real-time operations are served by a single endpoint,
    `POST /api/v1/{channelCode}/{operation}`. This reference lists each operation value (`transaction.create`,
    `campaign.inquiry`, ...) as its own path so that each request and response can be documented separately.

    **Field mapping.** Every channel has its own field mapping (request/response field names, units, authentication
    strategy). This reference uses the **standard mapping**, which is also the template for new integrations. If your
    channel was onboarded with custom field names (common for legacy POS protocols), the body shapes differ and are
    described in your channel's integration sheet — but the HTTP status codes always follow the table below. Some
    fields and operations are marked *"when enabled for your channel"*: they are part of the API but are only returned
    or accepted when your channel's mapping includes them. Ask your Ino Loyalty contact to enable them.

    **Amounts** in requests may be sent as decimal strings (`"119.00"`) or numbers. All amounts are in your loyalty
    program's currency.

    ## Authentication

    Each channel uses one of two strategies, chosen at provisioning time.

    ### API key with HMAC request signing (`API_KEY_HMAC`)

    Every request carries three headers:

    | Header | Meaning |
    |---|---|
    | `X-Api-Key` | Your API key |
    | `X-Timestamp` | Unix time in seconds; must be within 300 seconds of server time (replay protection) |
    | `X-Signature` | `hex(HMAC-SHA256(secret, X-Timestamp + "." + rawRequestBody))`, lowercase |

    Sign the **exact raw bytes** you send, not a re-serialized copy of your JSON object — whitespace differences change
    the signature. Requests without a body (`GET`, `DELETE`) are signed over an empty body, i.e. over `"{X-Timestamp}."`.

    ```js
    // Node.js 18+ (no dependencies)
    import crypto from "node:crypto";

    const host = "loyalty.example.com";            // provided during onboarding
    const body = JSON.stringify({
      requestId: crypto.randomUUID(),              // your idempotency key
      customerCode: "C-000245",
    });
    const timestamp = Math.floor(Date.now() / 1000).toString();
    const signature = crypto
      .createHmac("sha256", process.env.INO_API_SECRET)
      .update(`${timestamp}.${body}`)
      .digest("hex");

    const res = await fetch(`https://${host}/api/v1/MODERN_ECOM/customer.get360`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Api-Key": process.env.INO_API_KEY,
        "X-Timestamp": timestamp,
        "X-Signature": signature,
        "X-Correlation-Id": crypto.randomUUID(),
      },
      body,                                        // send exactly the string you signed
    });
    console.log(res.status, res.headers.get("x-correlation-id"), await res.json());
    ```

    **Managed API keys.** Your administrator issues keys in the Ino Loyalty app under
    **Settings → Developers → API keys**. A managed key starts with `ik_` and comes with its own secret; the headers and
    the signature are exactly the same. Give each calling system (a POS fleet, the online shop, a partner) its own key so
    that one can be rotated or revoked without touching the others. A key may be limited to:

    - **operations** — for example only `campaign.inquiry` and `transaction.create`. The webhook subscription endpoints
      need the `webhooks` permission, the bulk job endpoints the `jobs` permission and the event stream the `events`
      permission. A call outside the key's permissions returns `FORBIDDEN` (HTTP 403);
    - **IP addresses or ranges** — calls from any other address are rejected;
    - **an expiry date**.

    When a key is rotated, the old key keeps working for the overlap your administrator chose (24 hours, 1 hour or not
    at all). Rejections say why: `Invalid api_key.`, `This API key has been revoked.`, `This API key has expired.`,
    `This API key cannot be used from this IP address.`

    ### OAuth 2.0 client credentials (`OAUTH2_CLIENT_CREDENTIALS`)

    Send `Authorization: Bearer <token>`. Tokens must be signed with **RS256 or ES256** (HS256 is rejected). Ino Loyalty
    validates the issuer, audience, expiry and the token's client id (`azp` or `appid` claim) against what was
    provisioned for your channel.

    With either strategy, an authentication failure returns `AUTHENTICATION_ERROR` with HTTP **401**.

    ## Idempotency

    Every real-time operation reads a `requestId` field from the JSON body — a **GUID you generate**. It is your
    idempotency key and is echoed back as `RequestId` in the standard envelope.

    - Replaying the exact same body with the same `requestId` within **24 hours** returns the original response
      without executing the operation again (no double points).
    - Sending the same `requestId` with a **different** body returns `IDEMPOTENCY_REPLAY` (HTTP 409). Retry only with
      the *same* body, or generate a new `requestId` for a genuinely new request.
    - If you omit `requestId` or send something that is not a valid GUID, one is generated for you — which silently
      disables idempotency for that call. Always send your own.

    ## Rate limits

    Requests are limited per API key (or per client IP when no key is sent) — **600 requests per minute** by default.
    Exceeding the limit returns HTTP **429** with a `Retry-After` header (seconds to wait).

    ## Errors

    Branch on the **HTTP status code** first; it follows the same table for every channel. The body then tells you why.
    Two body shapes exist:

    - **Standard envelope** — returned by the webhook, event and job endpoints, by operations without a mapped response
      (`order.loyalty`, `transaction.reconcile`), and for errors raised before an operation runs (authentication,
      permissions, unknown channel, a missing or malformed field):

      ```json
      {
        "ResponseCode": "AUTHENTICATION_ERROR",
        "ResponseCodeValue": 1401,
        "ResponseMessage": "The HMAC signature could not be verified.",
        "RequestId": "6a5d1f2e-0b3a-4c1d-9e8f-1a2b3c4d5e6f",
        "Data": null,
        "Warnings": []
      }
      ```

    - **Mapped response** — operations with a mapped response (standard mapping) return `httpStatus` and `message`
      plus the operation's own fields, for success and for errors raised by the operation itself.

    | `ResponseCode` | Value | HTTP | Meaning | Retry? |
    |---|---|---|---|---|
    | `SUCCESS` | 1200 | 200 | Request succeeded | — |
    | `PARAMETER_ERROR` | 1400 | 400 | Validation failed | No — fix the request |
    | `AUTHENTICATION_ERROR` | 1401 | 401 | Bad or missing signature or token | No — fix credentials |
    | `FORBIDDEN` | 1403 | 403 | Authenticated but not allowed to call this operation | No |
    | `NOT_FOUND` | 1404 | 404 | Channel, operation or referenced record not found | No |
    | `CONFLICT` | 1409 | 409 | Duplicate order number, concurrent update, re-quote mismatch, etc. | No |
    | `PROVISION_EXPIRED` | 1410 | 410 | A point provision/reservation expired | No — re-reserve |
    | `IDEMPOTENCY_REPLAY` | 1420 | 409 | Same `requestId`, different payload | No — use a new `requestId` |
    | `GENERAL_ERROR` | 1500 | 500 | Unexpected server error | Yes, after a delay |
    | `UPSTREAM_UNAVAILABLE` | 1503 | 503 | A dependency is temporarily unavailable | Yes — honor backoff |

    The event stream additionally returns `CURSOR_EXPIRED` (HTTP 410) for a cursor older than the event retention.

    ## Correlation ids

    Send an `X-Correlation-Id` header to tie a request to your own logs and traces; it is echoed back in the
    `X-Correlation-Id` response header. If you don't send one, Ino Loyalty generates one and still returns it.
    Always log the response header's value and include it in support requests.

    ## Recommended integration patterns

    - **Real-time cart pricing.** Call `campaign.inquiry` with the **whole cart on every change** — Ino Loyalty keeps no
      cart state. Use a short timeout (about 1 second); on failure show list prices and never block checkout.
    - **Commit safely.** Save the order locally **before** calling `transaction.create`, and retry with the **same
      `requestId`** — duplicate sends return the original transaction.
    - **Offline tills.** See `transactionDate` on `transaction.create` and `campaign.inquiry`, the
      `transaction.reconcile` operation and the event stream.


servers:
  - url: https://{host}
    description: Your Ino Loyalty API host, provided during onboarding
    variables:
      host:
        default: loyalty.example.com
        description: Your Ino Loyalty API host, provided during onboarding

security:
  - ApiKey: []
    Timestamp: []
    Signature: []
  - OAuth2ClientCredentials: []

tags:
  - name: Transactions
    description: |
      Commit sales and reconcile queued sales after an outage.

      **Benefits always come from the loyalty engine.** On `transaction.create` Ino Loyalty evaluates the campaigns
      itself, once, for the sale's date and basket, and records points, discounts and vouchers from that result. A
      channel never grants its own loyalty benefit.
  - name: Campaigns
    description: Price a cart in real time — which campaign rewards it would earn — without committing anything.
  - name: Customers
    description: Register members (directly or with SMS verification) and look up their profile, balance, segments and consent.
  - name: Vouchers
    description: Check and redeem voucher codes.
  - name: Returns
    description: |
      Preview and commit returns and cancellations. Points are recorded per line at sale time, so returning a line gives
      back exactly the points that paid for it and takes back the points earned on it (a full return restores all).
      Which rewards survive a partial return is decided by re-pricing the remaining basket, so spend thresholds stay correct.
  - name: Points redemption
    description: |
      Points can be spent on **any channel that is online**. The flow is stateless — there is no reservation to manage.

      1. **Inquire.** Send `campaign.inquiry` as usual. For a recognised (non-guest) customer the response contains
         `redemption`: `MaxPoints` / `MaxAmount` are the most the customer may spend on this basket today (balance,
         program minimum and "max share of the purchase" limits applied — the top of your slider). When you sent
         `pointsToSpend`, it also contains `Points` / `Amount` (what was applied), `Payable` (the cash still due),
         `LineAmounts` (line → amount paid with points) and `Note` (why the amount was reduced).
      2. **Value.** Points are always whole numbers; a point is worth the program's point value (for example 50 points =
         $5.00). A *point value multiplier* campaign ("spend points on denim: 2×") makes points worth more on matching
         lines; points go to the most valuable lines first. Spending is calculated on the **discounted** basket. Points
         paid with do **not** earn points: base earning uses the cash actually paid.
      3. **Pay.** Send `transaction.create` with `pointsToSpend` and a `LOYALTY_POINT` payment whose `amount` is the
         **money value** (`redemption.Amount`) next to your cash payment(s). Ino Loyalty re-quotes the basket (campaigns,
         multipliers, balance, limits) and rejects with **409** if it no longer matches what you were shown (for example a
         campaign ended) — inquire again. The balance is checked under a customer lock, so concurrent sales cannot spend
         the same points twice; points are taken from the lots that expire first.
      4. **Returns** restore the points for the returned lines only. The cash refund for a line is its price minus
         discounts minus the money value of the points paid on it.

      Redemption needs the API: a sale made while a till is offline is completed without points.

      `pointsToSpend` and the `redemption` response object are available when enabled for your channel.
  - name: Orders
    description: Read an order's current, net loyalty result (the sale plus every return so far).
  - name: Webhooks
    description: |
      Manage webhook subscriptions programmatically, under your channel's existing authentication. Deliveries are signed
      HTTP POSTs of CloudEvents 1.0 envelopes — see the **Webhooks** section of this reference for every event type,
      its payload and the signature headers.

      The REST resource (`/webhooks/subscriptions`) is recommended for new integrations and is what automation platforms
      use. The earlier `subscribe` / `unsubscribe` / `list` / `{id}/test` endpoints keep working unchanged.

      `channelCode` identifies *who may manage* a subscription, not *which channel's events it receives*: a subscription
      created with your e-commerce credentials also receives events caused by POS or mobile channels. Use `eventTypes`
      (and, on the REST resource, `originChannels` / `storeIds`) to filter.

      **Verifying deliveries.** Ino Loyalty follows the [Standard Webhooks](https://www.standardwebhooks.com)
      specification, so the official libraries verify requests with one call:

      ```js
      import { Webhook } from "standardwebhooks";            // npm install standardwebhooks
      const wh = new Webhook(process.env.INO_WEBHOOK_SECRET);  // "whsec_..."
      const event = wh.verify(rawBody, request.headers);       // throws if the signature or timestamp is invalid
      ```

      Verify against the **raw bytes** you received, before any JSON parsing, and reject requests whose timestamp is more
      than 5 minutes old.

      **Delivery guarantees.**
      - **At-least-once.** Deduplicate with `webhook-id` (one per subscription × event, stable across retries) or with the
        CloudEvents `id` (one per event, the same for all your subscriptions).
      - **No events are lost while a subscription is paused or suspended**; they are delivered in order when it resumes.
        The queue is bounded to 10,000 waiting events and 7 days per subscription.
      - **Ordering** is best-effort (up to 4 parallel deliveries per endpoint); use the event's `time` for strict order.
      - **Timeout** is 10 seconds per attempt. Only `2xx` counts as success. Redirects are **not** followed.
      - **Retries** (non-2xx, timeout, connection error): about 30 s, 2 min, 10 min, 30 min, 1 h, 2 h, 4 h, 6 h, 8 h, then
        every 12 h (±10% jitter) — up to 20 attempts over roughly 6½ days. `Retry-After` on `429`/`503` is honoured (up to 24 h).
      - **`410 Gone`** from your endpoint stops the delivery and suspends the subscription immediately.
      - **Auto-suspend** happens only when every attempt has failed for 24 hours and at least 10 attempts in a row.
        Resume by subscribing again with the same URL (or `PATCH` with `status: ACTIVE`).
      - **Network policy:** deliveries go only to public internet addresses; URLs must use `https`.
  - name: Events
    description: |
      Pull the same events that webhooks deliver — useful for tills and store servers behind NAT that cannot receive
      webhooks — and read the machine-readable event catalog.
  - name: Jobs
    description: |
      Bulk operations that are too large for a single request/response (bulk point loads, segment exports, batch file
      imports). The API accepts the request, returns a job id immediately (`202 Accepted`) and processes the work in the
      background. Every job publishes exactly one `job.completed` or `job.failed` event when it finishes.

      **All job endpoints are `POST`**, including the status and result checks, so every call signs a body. Send `{}` as
      the body for status and result checks.

paths:

  # ------------------------------------------------------------------ Transactions

  /api/v1/{channelCode}/transaction.create:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: transactionCreate
      tags: [Transactions, Points redemption]
      summary: Commit a sale
      description: |
        Operation value `transaction.create` of `POST /api/v1/{channelCode}/{operation}`.

        Commits a sale: earns and spends points and applies campaign awards. Ino Loyalty evaluates the campaigns itself for
        the sale's date and basket — send **list prices** in `cart` / `lineItems` (`unitPrice = originalUnitPrice`, no
        external discount) and charge the customer the amounts `campaign.inquiry` returned. Campaign usage limits and
        budgets are counted again under a lock at commit, so two simultaneous sales cannot exceed a limit.

        - **Idempotent:** a retry with the same `requestId` and body returns the original transaction (no double points).
          Order numbers are unique per channel.
        - **Paying with points:** send `pointsToSpend` and a `LOYALTY_POINT` payment (see *Points redemption*). If the
          re-quoted basket no longer matches, the call is rejected with 409 — inquire again.
        - **Vouchers:** send `voucherCode`; the basket is re-priced and the call is rejected with 409 if the voucher is no
          longer valid. Once the sale is saved the voucher is marked used.
        - **Offline / store-and-forward:** send `transactionDate` (the moment of sale at the register). Campaigns are
          evaluated for that date, so a campaign that was active at the time of sale applies even if it has since ended.
          `transactionDate` is rejected with `PARAMETER_ERROR` if it is more than 5 minutes in the future or more than
          7 days in the past — treat that as terminal, not retryable. Generate `requestId` at the moment of sale, keep the
          queue FIFO per customer and resubmit with the original `requestId`, `orderNumber` and `transactionDate`.
          Redemption (paying with points) requires an online connection.
        - An `awards` array sent by older integrations is accepted for compatibility but **ignored**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreateRequest"
            examples:
              cashSale:
                summary: Online order paid by card
                value:
                  requestId: 6a5d1f2e-0b3a-4c1d-9e8f-1a2b3c4d5e6f
                  orderNumber: ORD-10482
                  customerId: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
                  transactionDate: "2026-11-03T14:30:00Z"
                  cart:
                    currentTotal: "119.00"
                    originalTotal: "119.00"
                    totalDiscount: "0"
                    lineItems:
                      - { lineNumber: 1, sku: MR-DJ-001, qty: 1, unitPrice: "89.00", originalUnitPrice: "89.00" }
                      - { lineNumber: 2, sku: MR-TS-014, qty: 2, unitPrice: "15.00", originalUnitPrice: "15.00" }
                  payments:
                    - { type: CREDIT_CARD, amount: "119.00" }
              withPoints:
                summary: Part-paid with points (when enabled for your channel)
                value:
                  requestId: 0c9e2b7a-3f41-4d8e-a6b2-7e5f1c2d3a4b
                  orderNumber: ORD-10483
                  customerId: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
                  pointsToSpend: 100
                  cart:
                    currentTotal: "119.00"
                    originalTotal: "119.00"
                    totalDiscount: "0"
                    lineItems:
                      - { lineNumber: 1, sku: MR-DJ-001, qty: 1, unitPrice: "89.00", originalUnitPrice: "89.00" }
                      - { lineNumber: 2, sku: MR-TS-014, qty: 2, unitPrice: "15.00", originalUnitPrice: "15.00" }
                  payments:
                    - { type: LOYALTY_POINT, amount: "10.00" }
                    - { type: CREDIT_CARD, amount: "109.00" }
      responses:
        "200":
          description: The sale was recorded.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCreateResponse"
              example:
                httpStatus: 200
                message: Success
                transactionId: b3a1d0c4-1e2f-4a5b-8c9d-0e1f2a3b4c5d
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/ProvisionExpired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/{channelCode}/transaction.reconcile:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: transactionReconcile
      tags: [Transactions]
      summary: Reconcile an offline queue
      description: |
        Operation value `transaction.reconcile` of `POST /api/v1/{channelCode}/{operation}`.

        After a till was offline, ask which queued sales Ino Loyalty has recorded instead of guessing. Read-only. Send 1–500
        order numbers; the answer lists every order in the same order, plus `missing` — the order numbers that were not
        recorded. Resubmit missing sales with their original `requestId` and `transactionDate` while they are inside the
        7-day window; older ones need a back-office decision. Order numbers are matched within the channel type of the
        request (POS, ECOM, ...), like `transaction.create`.

        Returns the standard envelope; the result is in `Data`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileRequest"
            example:
              requestId: 2f6b9c1d-4e3a-4b7c-8d9e-0a1b2c3d4e5f
              orderNumbers: [ORD-10482, ORD-10483, ORD-10484]
      responses:
        "200":
          description: Reconciliation result.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      Data:
                        $ref: "#/components/schemas/ReconcileResult"
              example:
                ResponseCode: SUCCESS
                ResponseCodeValue: 1200
                ResponseMessage: Success
                RequestId: 2f6b9c1d-4e3a-4b7c-8d9e-0a1b2c3d4e5f
                Data:
                  orders:
                    - OrderNumber: ORD-10482
                      Found: true
                      TransactionId: b3a1d0c4-1e2f-4a5b-8c9d-0e1f2a3b4c5d
                      Status: COMPLETED
                      TransactionDate: "2026-11-03T14:30:00+00:00"
                      RecordedAt: "2026-11-03T14:30:02+00:00"
                      Returns: 0
                    - OrderNumber: ORD-10483
                      Found: true
                      TransactionId: 7c2d4e6f-8a9b-4c1d-9e2f-3a4b5c6d7e8f
                      Status: PARTIALLY_RETURNED
                      TransactionDate: "2026-11-03T15:05:00+00:00"
                      RecordedAt: "2026-11-03T18:41:10+00:00"
                      Returns: 1
                    - OrderNumber: ORD-10484
                      Found: false
                      TransactionId: null
                      Status: null
                      TransactionDate: null
                      RecordedAt: null
                      Returns: 0
                  recorded: 2
                  missing: [ORD-10484]
                Warnings: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ------------------------------------------------------------------ Campaigns

  /api/v1/{channelCode}/campaign.inquiry:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: campaignInquiry
      tags: [Campaigns, Points redemption]
      summary: Preview campaign rewards for a cart
      description: |
        Operation value `campaign.inquiry` of `POST /api/v1/{channelCode}/{operation}`.

        A dry run: previews which campaign rewards a cart would earn, without committing anything. Same cart shape as
        `transaction.create`, without `orderNumber` and `payments`.

        - Call it with the **whole cart on every change**. Send list prices (`currentTotal = originalTotal`,
          `totalDiscount = 0`) and `sku` = the product code held in Ino Loyalty's catalog.
        - Basket-level discount rewards are spread across **all** lines proportionally to the remaining line value. Points
          campaigns are evaluated **after** all discount campaigns, so percent-of-amount points are based on the discounted
          basket total. A basket total condition compares the basket value after the discounts applied before that campaign.
          A campaign's channel list (Web / Mobile / POS) is enforced.
        - Optional `transactionDate` evaluates campaigns for the actual moment of sale (offline tills; same validity window
          as `transaction.create`).
        - When enabled for your channel: `pointsToSpend` and `voucherCode` in the request; `awards`, `redemption` and
          `voucher` in the response. A voucher is applied **after campaign discounts and before points**.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInquiryRequest"
            examples:
              cart:
                summary: Cart pricing
                value:
                  requestId: 9b8a7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
                  customerId: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
                  cart:
                    currentTotal: "119.00"
                    originalTotal: "119.00"
                    totalDiscount: "0"
                    lineItems:
                      - { lineNumber: 1, sku: MR-DJ-001, qty: 1, unitPrice: "89.00", originalUnitPrice: "89.00" }
                      - { lineNumber: 2, sku: MR-TS-014, qty: 2, unitPrice: "15.00", originalUnitPrice: "15.00" }
              withPointsAndVoucher:
                summary: Points slider and voucher (when enabled for your channel)
                value:
                  requestId: 1d2e3f4a-5b6c-4d7e-8f9a-0b1c2d3e4f5a
                  customerId: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
                  pointsToSpend: 100
                  voucherCode: SAVE10-7KQ2P
                  cart:
                    currentTotal: "119.00"
                    originalTotal: "119.00"
                    totalDiscount: "0"
                    lineItems:
                      - { lineNumber: 1, sku: MR-DJ-001, qty: 1, unitPrice: "89.00", originalUnitPrice: "89.00" }
                      - { lineNumber: 2, sku: MR-TS-014, qty: 2, unitPrice: "15.00", originalUnitPrice: "15.00" }
      responses:
        "200":
          description: Campaign evaluation for the cart.
