          description: Unsubscribed.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      Data:
                        type: object
                        properties:
                          unsubscribed:
                            type: boolean
                            const: true
              example:
                ResponseCode: SUCCESS
                ResponseCodeValue: 1200
                ResponseMessage: Success
                RequestId: 8e7f6a5b-4c3d-42bb-aaa9-988776655444
                Data: { unsubscribed: true }
                Warnings: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/{channelCode}/webhooks/list:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: webhookList
      tags: [Webhooks]
      summary: List subscriptions (POST)
      description: |
        Lists your channel's subscriptions — the secret is never included. `POST` so that the call signs a body; send `{}`.
        Equivalent to `GET /webhooks/subscriptions`.
      requestBody:
        $ref: "#/components/requestBodies/EmptyObject"
      responses:
        "200":
          description: Your subscriptions.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionListEnvelope"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/{channelCode}/webhooks/{id}/test:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/subscriptionId"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: webhookTest
      tags: [Webhooks]
      summary: Send a test event (original endpoint)
      description: |
        Sends a `webhook.test` event straight to one subscription and returns whether it was delivered. Send `{}` as the
        body. Equivalent to `POST /webhooks/subscriptions/{id}/test`.
      requestBody:
        $ref: "#/components/requestBodies/EmptyObject"
      responses:
        "200":
          description: Test delivery result.
          headers:
