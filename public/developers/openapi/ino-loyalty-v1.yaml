# ==================================================================== Components

components:

  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Your API key (`API_KEY_HMAC` channels). Managed keys start with `ik_`. Always sent together with `X-Timestamp`
        and `X-Signature`.
    Timestamp:
      type: apiKey
      in: header
      name: X-Timestamp
      description: Unix time in seconds; must be within 300 seconds of server time.
    Signature:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        `hex(HMAC-SHA256(secret, X-Timestamp + "." + rawRequestBody))`, lowercase. For requests without a body
        (`GET`, `DELETE`) sign `X-Timestamp + "."`.
    OAuth2ClientCredentials:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `OAUTH2_CLIENT_CREDENTIALS` channels: an access token obtained with the OAuth 2.0 client credentials grant from the
        identity provider agreed during onboarding. Tokens must be signed with RS256 or ES256 (HS256 is rejected); issuer,
        audience, expiry and client id (`azp` or `appid` claim) are validated against your channel's provisioning.

  parameters:
    channelCode:
      name: channelCode
      in: path
      required: true
      description: Your channel code, provisioned by Ino Loyalty and tied to your credentials and field mapping.
      schema: { type: string }
      example: MODERN_ECOM
    correlationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Your own id to tie the request to your logs and traces. Echoed back in the response; generated if omitted.
      schema: { type: string }
      example: 3b9f2c1e-7a64-4d0b-9e1f-6a2c8d4b5e70
    subscriptionId:
      name: id
      in: path
      required: true
      description: Subscription id.
      schema: { type: string, format: uuid }
      example: 0f1e2d3c-4b5a-4968-8776-655443322110
    jobId:
      name: jobId
      in: path
      required: true
      description: Job id returned when the job was submitted.
      schema: { type: string, format: uuid }
      example: 0a1b2c3d-0000-4000-8000-000000000007
    webhookId:
      name: webhook-id
      in: header
      required: true
      description: Delivery id — the same on every retry of the same delivery (one per subscription × event). Use it to deduplicate.
      schema: { type: string }
      example: 7e1d2c3b-4a59-4687-9a8b-1c2d3e4f5a6b
    webhookTimestamp:
      name: webhook-timestamp
      in: header
      required: true
      description: Unix time in seconds when the request was signed. Reject requests more than 5 minutes old.
      schema: { type: string }
      example: "1762180200"
    webhookSignature:
      name: webhook-signature
      in: header
      required: true
      description: |
        Standard Webhooks signature: `v1,<base64(HMAC-SHA256(key, webhook-id + "." + webhook-timestamp + "." + rawBody))>`.
        The key is your secret with the `whsec_` prefix removed, base64-decoded. During a secret rotation the header carries
        two space-separated signatures (new and previous secret) — accept the request if **any** of them matches.
      schema: { type: string }
      example: v1,EXAMPLEsignatureBase64=
    legacySignature:
      name: X-Ino-Signature
      in: header
      required: false
      deprecated: true
      description: |
        Legacy Ino signature, still sent; will be retired on 2027-05-01 (the Standard Webhooks headers stay).
        `hex(HMAC-SHA256(UTF8(secret), X-Timestamp + "." + rawBody))`, lowercase — always computed with the current secret.
      schema: { type: string }
      example: 3f6c0e9a...
    legacyTimestamp:
      name: X-Timestamp
      in: header
      required: false
      deprecated: true
      description: Legacy signature timestamp (Unix seconds), used with `X-Ino-Signature`.
      schema: { type: string }
      example: "1762180200"
    legacyWebhookId:
      name: X-Webhook-Id
      in: header
      required: false
      deprecated: true
      description: Same value as `webhook-id`.
      schema: { type: string }
      example: 7e1d2c3b-4a59-4687-9a8b-1c2d3e4f5a6b
    webhookUserAgent:
      name: User-Agent
      in: header
      required: true
      description: Always `InoLoyalty-Webhooks/1.0`.
      schema: { type: string, const: InoLoyalty-Webhooks/1.0 }

  headers:
    X-Correlation-Id:
      description: The correlation id you sent, or the one generated for this request. Include it in support requests.
      schema: { type: string }
    Retry-After:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  requestBodies:
    EmptyObject:
      description: An empty JSON object, so that the request has a body to sign.
      required: true
      content:
        application/json:
          schema:
            type: object
            maxProperties: 0
          example: {}

  responses:
    BadRequest:
      description: "`PARAMETER_ERROR` — validation failed. Fix the request; do not retry unchanged."
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            envelope:
              summary: Standard envelope
              value:
                ResponseCode: PARAMETER_ERROR
                ResponseCodeValue: 1400
                ResponseMessage: Phone number is required
                RequestId: 8e7d6c5b-4a39-4b28-9c17-0d6e5f4a3b2c
                Data: null
                Warnings: []
            mapped:
              summary: Mapped response
              value:
                httpStatus: 400
                message: transactionDate is more than 7 days in the past.
    Unauthorized:
      description: "`AUTHENTICATION_ERROR` — bad or missing signature, key or token. Fix credentials; do not retry unchanged."
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example:
            ResponseCode: AUTHENTICATION_ERROR
            ResponseCodeValue: 1401
            ResponseMessage: The request timestamp is outside the accepted window (replay protection).
            RequestId: 6a5d1f2e-0b3a-4c1d-9e8f-1a2b3c4d5e6f
            Data: null
            Warnings: []
    Forbidden:
      description: "`FORBIDDEN` — authenticated, but the channel or API key is not allowed to call this operation."
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
          example:
            ResponseCode: FORBIDDEN
            ResponseCodeValue: 1403
            ResponseMessage: This API key is not allowed to call transaction.create. Ask your administrator to add it to the key.
            RequestId: 6a5d1f2e-0b3a-4c1d-9e8f-1a2b3c4d5e6f
            Data: null
            Warnings: []
    NotFound:
      description: "`NOT_FOUND` — channel, operation or referenced record (order, voucher, customer, job, subscription) not found."
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            envelope:
              summary: Standard envelope
              value:
                ResponseCode: NOT_FOUND
                ResponseCodeValue: 1404
                ResponseMessage: No order ORD-10999 was found.
                RequestId: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a
                Data: null
                Warnings: []
            mapped:
              summary: Mapped response
              value:
                httpStatus: 404
                message: "OrderNumber not found: ORD-10999"
    Conflict:
      description: |
        `CONFLICT` — duplicate order number, concurrent update, or the basket/voucher no longer matches what was quoted
        (inquire again). Also `IDEMPOTENCY_REPLAY` — the same `requestId` was sent with a different body; use a new
        `requestId` for a genuinely new request.
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          examples:
            conflict:
              summary: Re-quote mismatch (mapped response)
              value:
                httpStatus: 409
                message: The basket no longer matches the quoted points payment. Inquire again.
            replay:
              summary: Idempotency replay (standard envelope)
              value:
                ResponseCode: IDEMPOTENCY_REPLAY
                ResponseCodeValue: 1420
                ResponseMessage: The requestId was already used with a different payload.
                RequestId: 6a5d1f2e-0b3a-4c1d-9e8f-1a2b3c4d5e6f
                Data: null
                Warnings: []
    ProvisionExpired:
      description: "`PROVISION_EXPIRED` — a point provision/reservation expired. Re-reserve."
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    TooManyRequests:
      description: Rate limit exceeded (600 requests per minute per API key by default). Wait for `Retry-After` seconds.
      headers:
        Retry-After: { $ref: "#/components/headers/Retry-After" }
    ServerError:
      description: "`GENERAL_ERROR` — unexpected server error. Retry after a delay (with the same `requestId`)."
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            ResponseCode: GENERAL_ERROR
            ResponseMessage: An unexpected error occurred.
    Unavailable:
      description: "`UPSTREAM_UNAVAILABLE` — a dependency is temporarily unavailable. Retry with backoff (with the same `requestId`)."
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            ResponseCode: UPSTREAM_UNAVAILABLE
            ResponseMessage: A dependent system is currently unavailable; please try again.

  schemas:

    # ---------------------------------------------------------------- Envelope and errors

    ResponseCode:
      type: string
      description: |
        Result code. `SUCCESS` 1200, `PARAMETER_ERROR` 1400, `AUTHENTICATION_ERROR` 1401, `FORBIDDEN` 1403,
        `NOT_FOUND` 1404, `CONFLICT` 1409, `PROVISION_EXPIRED` 1410, `IDEMPOTENCY_REPLAY` 1420, `GENERAL_ERROR` 1500,
        `UPSTREAM_UNAVAILABLE` 1503.
      enum:
        - SUCCESS
        - PARAMETER_ERROR
        - AUTHENTICATION_ERROR
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - PROVISION_EXPIRED
        - IDEMPOTENCY_REPLAY
        - GENERAL_ERROR
        - UPSTREAM_UNAVAILABLE

    Envelope:
      type: object
      description: |
        The standard response envelope. Returned by the webhook, event and job endpoints, by operations without a mapped
        response, and for errors raised before an operation runs.
      properties:
        ResponseCode:
          $ref: "#/components/schemas/ResponseCode"
        ResponseCodeValue:
          type: integer
          description: Numeric form of `ResponseCode`.
          examples: [1200]
        ResponseMessage:
          type: string
          description: Human-readable message.
        RequestId:
          type: string
          description: Your `requestId` for real-time operations; the correlation id for webhook, event and job endpoints.
        Data:
          description: Operation-specific result, or `null`.
        Warnings:
          type: array
          items: { type: string }
          description: Non-fatal warnings.
      required: [ResponseCode, ResponseMessage]

    MappedResult:
      type: object
      description: Base of every mapped operation response (standard mapping).
      properties:
        httpStatus:
          type: integer
          description: The HTTP status code of this response.
          examples: [200]
        message:
          type: string
          description: Human-readable result message.
          examples: [Success]
      required: [httpStatus, message]

    ErrorResponse:
      description: An error in either the standard envelope or the mapped form. Branch on the HTTP status code.
      oneOf:
        - $ref: "#/components/schemas/Envelope"
        - $ref: "#/components/schemas/MappedResult"

    # ---------------------------------------------------------------- Shared request parts

    RequestBase:
      type: object
      properties:
        requestId:
          type: string
          format: uuid
          description: |
            A GUID you generate — your idempotency key. Replaying the same body with the same `requestId` within 24 hours
            returns the original response. Always send your own; if it is missing or not a GUID, one is generated and
            idempotency is disabled for the call.
          examples: [6a5d1f2e-0b3a-4c1d-9e8f-1a2b3c4d5e6f]
      required: [requestId]

    Amount:
      description: A decimal amount, as a string (recommended) or a number.
      type: [string, number]
      examples: ["119.00"]

    Cart:
      type: object
      description: The basket. Send list prices — `currentTotal = originalTotal`, `totalDiscount = 0`.
      properties:
        currentTotal:
          $ref: "#/components/schemas/Amount"
          description: Current basket total.
        originalTotal:
          $ref: "#/components/schemas/Amount"
          description: Basket total at list prices.
        totalDiscount:
          $ref: "#/components/schemas/Amount"
          description: Discount the channel applied on its own (price markdowns), recorded as an external discount — not a loyalty benefit. Defaults to 0.
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
      required: [currentTotal, originalTotal, lineItems]

    LineItem:
      type: object
      properties:
        lineNumber:
          type: integer
          description: Line number in the cart; awards and returns refer to it.
          examples: [1]
        sku:
          type: string
          description: The product code held in Ino Loyalty's catalog (for catalogs synced at colour level this is not the size-level variant code).
          examples: [MR-DJ-001]
        qty:
          type: number
          description: Quantity.
          examples: [1]
        unitPrice:
          $ref: "#/components/schemas/Amount"
          description: Current unit price.
        originalUnitPrice:
          $ref: "#/components/schemas/Amount"
          description: List unit price.
      required: [lineNumber, sku, qty, unitPrice, originalUnitPrice]

    Payment:
      type: object
      properties:
        type:
          type: string
          enum: [CASH, CREDIT_CARD, LOYALTY_POINT, GIFT_CARD]
          description: Payment type code. An unknown code returns 404. For `LOYALTY_POINT`, `amount` is the money value of the points.
        amount:
          $ref: "#/components/schemas/Amount"
          description: Amount paid with this payment type.
      required: [type, amount]

    TransactionDate:
      type: string
      format: date-time
      description: |
        The actual moment of sale at the register (offline / store-and-forward). Campaigns are evaluated for this date
        instead of "now". Rejected with `PARAMETER_ERROR` if more than 5 minutes in the future or more than 7 days in the past.
      examples: ["2026-11-03T14:30:00Z"]

    ReturnedItem:
      type: object
      properties:
        lineNumber:
          type: integer
          description: Line number of the original sale.
          examples: [2]
        sku:
          type: string
          description: Product code of the returned line.
          examples: [MR-TS-014]
        qty:
          type: number
          description: Quantity returned.
          examples: [1]
      required: [lineNumber, qty]

    # ---------------------------------------------------------------- Transactions

    TransactionCreateRequest:
      allOf:
        - $ref: "#/components/schemas/RequestBase"
        - type: object
          properties:
            orderNumber:
              type: string
              description: Your order number. Unique per channel; keep it unchanged on retries.
              examples: [ORD-10482]
            customerId:
              type: [string, "null"]
              description: Ino Loyalty customer id. Omit for a guest sale.
              examples: [6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10]
            transactionDate:
              $ref: "#/components/schemas/TransactionDate"
            cart:
              $ref: "#/components/schemas/Cart"
            payments:
              type: array
              items:
                $ref: "#/components/schemas/Payment"
            pointsToSpend:
              type: integer
              description: "Points the customer pays with (see *Points redemption*). Send together with a `LOYALTY_POINT` payment. When enabled for your channel."
              examples: [100]
            voucherCode:
              type: string
              description: Voucher code to apply to the basket. When enabled for your channel.
              examples: [SAVE10-7KQ2P]
          required: [orderNumber, cart, payments]

    TransactionCreateResponse:
      allOf:
        - $ref: "#/components/schemas/MappedResult"
        - type: object
          properties:
            transactionId:
              type: [string, "null"]
              description: Ino Loyalty transaction id.
              examples: [b3a1d0c4-1e2f-4a5b-8c9d-0e1f2a3b4c5d]

    ReconcileRequest:
      allOf:
        - $ref: "#/components/schemas/RequestBase"
        - type: object
          properties:
            orderNumbers:
              type: array
              minItems: 1
              maxItems: 500
              items: { type: string }
              description: 1–500 order numbers to check.
          required: [orderNumbers]

    ReconcileResult:
      type: object
      properties:
        orders:
          type: array
          description: One row per requested order number, in the same order.
          items:
            type: object
            properties:
              OrderNumber: { type: string }
              Found: { type: boolean, description: Whether the sale is recorded. }
              TransactionId: { type: [string, "null"], format: uuid }
              Status:
                type: [string, "null"]
                enum: [COMPLETED, PARTIALLY_RETURNED, REFUNDED, CANCELLED, null]
              TransactionDate: { type: [string, "null"], format: date-time, description: The sale time. }
              RecordedAt: { type: [string, "null"], format: date-time, description: When Ino Loyalty recorded the sale. }
              Returns: { type: integer, description: Number of returns recorded for the order. }
        recorded:
          type: integer
          description: Number of order numbers that are recorded.
        missing:
          type: array
          items: { type: string }
          description: Order numbers that were not recorded.

    # ---------------------------------------------------------------- Campaigns

    CampaignInquiryRequest:
      allOf:
        - $ref: "#/components/schemas/RequestBase"
        - type: object
          properties:
            customerId:
              type: [string, "null"]
              description: Ino Loyalty customer id. Omit for a guest cart (no `redemption` is returned).
              examples: [6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10]
            transactionDate:
              $ref: "#/components/schemas/TransactionDate"
            cart:
              $ref: "#/components/schemas/Cart"
            pointsToSpend:
              type: integer
              description: Points the customer wants to use (for example from a slider). When enabled for your channel.
              examples: [100]
            voucherCode:
              type: string
              description: Voucher code to validate and apply. When enabled for your channel.
              examples: [SAVE10-7KQ2P]
          required: [cart]

    CampaignInquiryResponse:
      allOf:
        - $ref: "#/components/schemas/MappedResult"
        - type: object
          properties:
            spendablePoints:
              type: number
              description: Total points the cart would earn from the evaluated campaigns (the sum of the award points).
              examples: [119]
            awards:
              type: array
              description: Campaign rewards for the cart. When enabled for your channel.
              items:
                $ref: "#/components/schemas/CampaignAward"
            voucher:
              $ref: "#/components/schemas/VoucherApplication"
            redemption:
              $ref: "#/components/schemas/Redemption"

    CampaignAward:
      type: object
      properties:
        RowNumber:
          type: [integer, "null"]
          description: The cart `lineNumber` the award applies to; `null` = basket-wide (for example points).
        CampaignCode:
          type: [string, "null"]
          description: Campaign code.
        CampaignName:
          type: [string, "null"]
          description: Display name ("Program base earn" for the program's base earning) — show it instead of the code.
        DiscountAmount:
          type: number
          description: Discount on this line (basket-level discounts are spread across all lines).
        Point:
          type: number
          description: Points awarded.
        PointValidDays:
          type: [integer, "null"]
          description: Days the awarded points stay valid.

    VoucherApplication:
      type: object
      description: Result of applying `voucherCode`. When enabled for your channel.
      properties:
        Code: { type: string }
        IsValid: { type: boolean }
        Message: { type: [string, "null"], description: Why the voucher cannot be applied. }
        Amount: { type: number, description: Discount the voucher gives on this basket. }

    Redemption:
      type: object
      description: Paying with points for a recognised customer (see *Points redemption*). When enabled for your channel.
      properties:
        MaxPoints:
          type: integer
          description: The most points the customer may spend on this basket today — the top of your slider.
        MaxAmount:
          type: number
          description: Money value of `MaxPoints`.
        Points:
          type: integer
          description: Points applied (when you sent `pointsToSpend`).
        Amount:
          type: number
          description: Money value of the applied points — use it as the `LOYALTY_POINT` payment amount in `transaction.create`.
        Payable:
          type: number
          description: Cash still due.
        LineAmounts:
          type: object
          description: Cart line number → amount paid with points on that line.
          additionalProperties: { type: number }
        Note:
          type: [string, "null"]
          description: Why the applied amount was reduced, if it was.

    # ---------------------------------------------------------------- Customers

    CustomerGet360Request:
      allOf:
        - $ref: "#/components/schemas/RequestBase"
        - type: object
          description: Identify the customer by one of the fields below.
          properties:
            customerCode:
              type: string
              examples: [C-000245]
            mobilePhone:
              type: string
              examples: ["+15555550142"]
            cardNumber:
              type: string
              examples: ["6001000002451"]

    CustomerGet360Response:
      allOf:
        - $ref: "#/components/schemas/MappedResult"
        - type: object
          properties:
            customerId: { type: [string, "null"], description: Ino Loyalty customer id. }
            customerCode: { type: [string, "null"] }
            fullName: { type: [string, "null"] }
            cardNumber: { type: [string, "null"] }
            cardStatus: { type: [string, "null"] }
            pointBalance: { type: number, description: Current point balance. }
            lifetimePointEarned: { type: number, description: Points earned over the membership's lifetime. }
            segments:
              type: array
              items: { type: string }
              description: Codes of the customer's active segments.
            smsPermission: { type: boolean }
            emailPermission: { type: boolean }
            walletPassUrl:
              type: [string, "null"]
              description: Relative path of the Apple Wallet pass (when enabled); prefix it with the API base URL.

    CustomerCreateRequest:
      allOf:
        - $ref: "#/components/schemas/RequestBase"
        - type: object
          properties:
            fullName:
              type: string
              examples: [Emma Clark]
            mobilePhone:
              type: string
              description: Required. International format.
              examples: ["+15555550142"]
            email:
              type: string
              format: email
              examples: [emma.clark@example.com]
            assignVirtualCard:
              type: boolean
              default: false
              description: Assign a virtual loyalty card to the new customer.
          required: [fullName, mobilePhone]

    CustomerCreateResponse:
      allOf:
        - $ref: "#/components/schemas/MappedResult"
        - $ref: "#/components/schemas/RegistrationFields"
        - type: object
          properties:
            needsVerification:
              type: boolean
              description: "`true` when SMS verification is enabled for the program: the member was not created; use `customer.register.initiate` / `.confirm`."
            verificationId: { type: [string, "null"] }
            maskedPhone: { type: [string, "null"] }
            alreadyExisted: { type: boolean, description: The customer already existed. }

    RegistrationFields:
      type: object
      properties:
        customerId: { type: [string, "null"], description: Ino Loyalty customer id. }
        cardNumber: { type: [string, "null"] }
        cardWarning: { type: [string, "null"], description: "A warning about the card assignment, if any." }
        walletPassUrl:
          type: [string, "null"]
          description: Relative path of the Apple Wallet pass (when enabled); prefix it with the API base URL.

    RegisterInitiateRequest:
      allOf:
        - $ref: "#/components/schemas/RequestBase"
        - type: object
          properties:
            firstName: { type: string, examples: [Emma] }
            lastName: { type: string, examples: [Clark] }
            mobilePhone: { type: string, examples: ["+15555550142"] }
            email: { type: string, format: email, examples: [emma.clark@example.com] }
            assignVirtualCard:
              type: boolean
              default: false
              description: Assign a virtual loyalty card to the new customer.
          required: [firstName, lastName]

    RegisterInitiateResponse:
      allOf:
        - $ref: "#/components/schemas/MappedResult"
        - $ref: "#/components/schemas/RegistrationFields"
        - type: object
          properties:
            needsVerification:
              type: boolean
              description: "`true` when an SMS code was sent; confirm with `customer.register.confirm`."
            verificationId:
              type: [string, "null"]
              description: Pass it to `customer.register.confirm` together with the SMS code.
            maskedPhone: { type: [string, "null"], description: "The phone number the code was sent to, masked." }
            alreadyExisted: { type: boolean, description: The customer already existed. }
            customerCode: { type: [string, "null"] }

    RegisterConfirmRequest:
      allOf:
        - $ref: "#/components/schemas/RequestBase"
        - type: object
          properties:
            verificationId:
              type: string
              description: From `customer.register.initiate`.
              examples: [5e6f7a8b-9c0d-4e1f-a2b3-c4d5e6f7a8b9]
            code:
              type: string
              description: The SMS code the customer received.
              examples: ["482913"]
          required: [verificationId, code]

    RegisterConfirmResponse:
      allOf:
        - $ref: "#/components/schemas/MappedResult"
        - $ref: "#/components/schemas/RegistrationFields"
        - type: object
          properties:
            customerCode: { type: [string, "null"] }

    # ---------------------------------------------------------------- Vouchers

    VoucherValidateRequest:
      allOf:
        - $ref: "#/components/schemas/RequestBase"
        - type: object
          properties:
            code:
              type: string
              examples: [SAVE10-7KQ2P]
            customerId:
              type: [string, "null"]
              description: Ino Loyalty customer id, for vouchers assigned to a customer.
          required: [code]

    VoucherValidateResponse:
      allOf:
        - $ref: "#/components/schemas/MappedResult"
        - type: object
          properties:
            isValid: { type: boolean, description: Whether the voucher can be used. }
            voucherMessage: { type: [string, "null"], description: "Why the voucher cannot be used, if it cannot." }
            voucherType: { type: [string, "null"], description: "Voucher type, for example `AMOUNT`." }
            value: { type: [number, "null"], description: Voucher value. }

    VoucherRedeemRequest:
      allOf:
        - $ref: "#/components/schemas/RequestBase"
        - type: object
          properties:
            code:
              type: string
              examples: [SAVE10-7KQ2P]
            orderNumber:
              type: string
              examples: [ORD-10482]
          required: [code, orderNumber]

    VoucherRedeemResponse:
      allOf:
        - $ref: "#/components/schemas/MappedResult"
        - type: object
          properties:
            code: { type: [string, "null"] }
            status: { type: [string, "null"], description: The voucher's status after the redemption. }

    # ---------------------------------------------------------------- Returns

    ReturnItemsRequest:
      allOf:
        - $ref: "#/components/schemas/RequestBase"
        - type: object
          properties:
            orderNumber:
              type: string
              description: Order number of the original sale.
              examples: [ORD-10482]
            returnedItems:
              type: array
              items:
                $ref: "#/components/schemas/ReturnedItem"
          required: [orderNumber, returnedItems]

    ReturnCommitRequest:
      allOf:
        - $ref: "#/components/schemas/ReturnItemsRequest"
        - type: object
          properties:
            returnType:
              type: string
              enum: [RETURN, CANCEL]
              default: RETURN
              description: "`RETURN` for a return, `CANCEL` for a cancellation."

    ReturnInquiryResponse:
      allOf:
        - $ref: "#/components/schemas/MappedResult"
        - type: object
          properties:
            spentPointAmount:
              type: number
              description: Points that were spent (paid with) on the returned lines and would be given back.

    RefundBreakdown:
      type: object
      properties:
        cashRefund: { type: number, description: Cash to refund. }
        returnedGross: { type: number, description: Gross value of the returned lines. }
        discountReversal: { type: number, description: Discount that stops being valid when the remaining basket is re-priced. }
        pointsValue: { type: number, description: "Value paid with points on the returned lines — returned as points, not cash." }
        voucherValue: { type: number, description: Value paid with a voucher on the returned lines. }
        spendPointReversal: { type: number, description: Spent points given back. }
        earnPointReversal: { type: number, description: Earned points taken back. }
        lines:
          type: array
          description: Per-line breakdown.
          items: { type: object }

    ReturnQuoteResponse:
      allOf:
        - $ref: "#/components/schemas/MappedResult"
        - $ref: "#/components/schemas/RefundBreakdown"

    ReturnCommitResponse:
      allOf:
        - $ref: "#/components/schemas/MappedResult"
        - type: object
          properties:
            refund:
              $ref: "#/components/schemas/RefundBreakdown"
              description: Refund breakdown. When enabled for your channel.

    # ---------------------------------------------------------------- Orders

    OrderLoyaltyRequest:
      allOf:
        - $ref: "#/components/schemas/RequestBase"
        - type: object
          properties:
            orderNumber:
              type: string
              examples: [ORD-10482]
          required: [orderNumber]

    OrderLoyaltySummary:
      type: object
      description: The order's current, net loyalty result — the sale plus every return so far.
      properties:
        SchemaVersion: { type: integer, description: Version of this summary format. }
        OrderNumber: { type: string }
        TransactionId: { type: string }
        Channel: { type: string, description: "Channel type of the sale, for example `ECOM` or `POS`." }
        Status:
          type: string
          enum: [COMPLETED, PARTIALLY_RETURNED, REFUNDED, CANCELLED]
        MemberId: { type: [string, "null"], description: Ino Loyalty customer id. }
        StoreCode: { type: [string, "null"] }
        TierCode: { type: [string, "null"] }
        TransactionDate: { type: string, format: date-time }
        OriginalAmount: { type: number }
        PointsEarned: { type: number, description: Net points earned. }
        PointsSpent: { type: number, description: Net points spent. }
        LoyaltyDiscount: { type: number, description: Net loyalty discount. }
        VoucherUsed:
          type: [object, "null"]
          properties:
            Code: { type: string }
            Amount: { type: number }
        Campaigns:
          type: array
          description: Net points, discount and voucher value per campaign.
          items:
            type: object
            properties:
              CampaignId: { type: string }
              CampaignCode: { type: [string, "null"] }
              CampaignName: { type: [string, "null"] }
              Points: { type: number }
              Discount: { type: number }
              VoucherValue: { type: number }
        VouchersIssued:
          type: array
          items:
            type: object
            properties:
              Code: { type: string }
              Type: { type: string }
              Value: { type: number }
              Status: { type: string }
              ExpiresAt: { type: [string, "null"], format: date-time }
              CampaignId: { type: [string, "null"] }
        Returns:
          type: array
          items:
            type: object
            properties:
              ReturnId: { type: string, format: uuid }
              ReturnType: { type: string }
              IsFullReturn: { type: boolean }
              CreatedAt: { type: string, format: date-time }
              EarnPointsReversed: { type: number }
              SpendPointsReturned: { type: number }
              CashRefund: { type: number }
              DiscountReversal: { type: number }
              ReturnReason: { type: [string, "null"] }
              VoucherReinstated: { type: boolean }
        Version:
          type: integer
          description: Only grows. Ignore a summary whose version is lower than one you already stored.
        GeneratedAt: { type: string, format: date-time }
        PointsPending:
          type: number
          description: Points held until the return period ends (when the program holds points).
        PointsPendingUntil:
          type: [string, "null"]
          format: date-time
          description: When the pending points become spendable.

    # ---------------------------------------------------------------- Webhook subscriptions

    WebhookSubscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        eventTypes:
          type: array
          items: { type: string }
          description: Subscribed event types; empty = all public event types.
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
          description: "`ACTIVE` or `SUSPENDED` (a paused subscription also shows `SUSPENDED` here; see `state`)."
        state:
          type: string
          enum: [ACTIVE, PAUSED, SUSPENDED]
          description: "`ACTIVE`, `PAUSED` (paused by an administrator or via `PATCH`) or `SUSPENDED` (paused automatically after repeated failures)."
        createdAt: { type: string, format: date-time }
        originChannels:
          type: [array, "null"]
          items: { type: string }
          description: Only events caused by these channel codes (empty = all).
        storeIds:
          type: [array, "null"]
          items: { type: string }
          description: Only events of these stores, plus events that belong to no store (empty = all).

    EventTypeWarnings:
      type: array
      items: { type: string }
      description: One warning per unknown event type — such a type would never be delivered.

    SubscriptionCreateRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Your https endpoint.
        eventTypes:
          type: array
          items: { type: string }
          description: Event types to receive; omitted or `[]` = all public event types.
        originChannels:
          type: array
          items: { type: string }
          description: Only events caused by these channel codes.
        storeIds:
          type: array
          items: { type: string }
          description: Only events of these stores, plus events that belong to no store.
      required: [url]

    SubscriptionPatchRequest:
      type: object
      properties:
        url: { type: string, format: uri }
        eventTypes:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [ACTIVE, PAUSED]
          description: "`PAUSED` to pause (events keep queuing), `ACTIVE` to resume."
        originChannels:
          type: array
          items: { type: string }
        storeIds:
          type: array
          items: { type: string }

    SubscriptionCreateEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: object
              properties:
                subscription:
                  $ref: "#/components/schemas/WebhookSubscription"
                secret:
                  type: [string, "null"]
                  description: The signing secret (`whsec_` followed by base64) — only when the subscription was created. Store it immediately; it is never shown again.
                warnings:
                  $ref: "#/components/schemas/EventTypeWarnings"

    SubscriptionListEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            Data:
              type: object
              properties:
                subscriptions:
                  type: array
                  items:
                    $ref: "#/components/schemas/WebhookSubscription"

    SubscribeRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: Your https endpoint. Subscribing again with the same URL updates the subscription.
        eventTypes:
          type: array
          items: { type: string }
          description: Event types to receive; omitted or `[]` = all event types.
        rotateSecret:
          type: boolean
          description: Issue a new secret (invalidates the old one).
      required: [url]

    SubscribeResult:
      type: object
      properties:
        subscriptionId: { type: string, format: uuid }
        url: { type: string, format: uri }
        eventTypes:
          type: array
          items: { type: string }
        secretRotated:
          type: boolean
          description: "`true` when a new secret was issued (first creation or `rotateSecret`)."
        secret:
          type: [string, "null"]
          description: The signing secret — only when `secretRotated` is `true`.
        warnings:
          $ref: "#/components/schemas/EventTypeWarnings"

    UnsubscribeRequest:
      type: object
      description: Send either `url` or `subscriptionId`.
      properties:
        url: { type: string, format: uri }
        subscriptionId: { type: string, format: uuid }

    TestDeliveryResult:
      type: object
      properties:
        sent: { type: boolean, description: Whether your endpoint answered with 2xx. }
        httpStatus: { type: [integer, "null"], description: Status code your endpoint returned. }
        durationMs: { type: [integer, "null"], description: Round-trip time. }
        error: { type: [string, "null"], description: "What went wrong, when not delivered." }

    # ---------------------------------------------------------------- Events

    EventPage:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/CloudEvent"
        cursor:
          type: string
          description: Pass it as `after` on the next call.
        hasMore:
          type: boolean
          description: "`true` when more events are waiting — call again at once."

    EventCatalog:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              type: { type: string, examples: [points.earned] }
              version: { type: integer, description: Current `dataversion` of the event type. }
              group: { type: string, examples: [Points] }
              title: { type: string }
              description: { type: string }
              visibility: { type: string, examples: [public] }
              example:
                $ref: "#/components/schemas/CloudEvent"
              dataSchema:
                type: object
                description: JSON Schema of the event's `data`.

    CloudEvent:
      type: object
      description: |
        CloudEvents 1.0 envelope — the body of every webhook delivery and every event in the event stream.
        Deduplicate with `id` (one per event, the same for all your subscriptions).
      properties:
        id:
          type: string
          description: Event id — one per event, the same for all subscriptions.
        source:
          type: string
          const: ino-loyalty-api
        type:
          type: string
          description: Event type, for example `points.earned`.
        specversion:
          type: string
          const: "1.0"
        time:
          type: string
          format: date-time
          description: When the event occurred. Use it if you need strict ordering.
        subject:
          type: [string, "null"]
          description: The customer id the event is about, or `null`.
        dataversion:
          type: integer
          description: Version of the `data` shape for this event type. New versions only add fields.
        originchannel:
          type: string
          description: Extension — the channel code whose request caused the event. Absent for background events.
        storeid:
          type: string
          description: Extension — the store where the event happened, when known.
        data:
          type: object
          description: Event-specific data.
      required: [id, source, type, specversion, time, dataversion, data]

    # ---------------------------------------------------------------- Event payloads

    Event.TransactionCompleted:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: transaction.completed }
            dataversion: { const: 2 }
            data:
              type: object
              properties:
                transactionId: { type: string }
                customerId: { type: [string, "null"] }
                orderNumber: { type: string }
                channel: { type: string, description: "Channel type, for example `ECOM` or `POS`." }
                originalSalePrice: { type: number }
                finalSalePrice: { type: number }
                totalEarnPoints: { type: number }
                totalSpendPoints: { type: number }
                transactionDate: { type: string, format: date-time }
                loyaltyDiscount: { type: [number, "null"], description: v2. }
                storeCode: { type: [string, "null"], description: v2. }
                tierCode: { type: [string, "null"], description: v2. }
                voucherCode: { type: [string, "null"], description: v2 — the voucher used. }
                voucherAmount: { type: [number, "null"], description: v2. }
                spendPointsValue: { type: [number, "null"], description: v2 — money value of the points spent. }
                awards:
                  type: [array, "null"]
                  description: v2 — the award of each campaign (one row per campaign).
                  items:
                    type: object
                    properties:
                      campaignId: { type: string }
                      campaignCode: { type: [string, "null"] }
                      points: { type: number }
                      discount: { type: number }
                      voucher: { type: boolean, description: The campaign issued a voucher. }
                pointsPendingUntil:
                  type: [string, "null"]
                  format: date-time
                  description: When the program holds points, the earned points are pending until this time; otherwise `null`.

    Event.TransactionReturned:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: transaction.returned }
            dataversion: { const: 3 }
            data:
              type: object
              properties:
                transactionId: { type: string }
                customerId: { type: [string, "null"] }
                orderNumber: { type: string }
                reversedEarnPoints: { type: number, description: Earned points taken back. }
                reversedSpendPoints: { type: number, description: Spent points given back. }
                returnReason: { type: [string, "null"] }
                returnId: { type: [string, "null"], description: v2. }
                returnType: { type: [string, "null"], description: v2. }
                isFullReturn: { type: [boolean, "null"], description: v2. }
                cashRefund: { type: [number, "null"], description: v2. }
                discountReversal: { type: [number, "null"], description: v2. }
                voucherReinstated: { type: [boolean, "null"], description: v2. }
                items:
                  type: [array, "null"]
                  description: v2 — returned lines.
                  items:
                    type: object
                    properties:
                      rowNumber: { type: integer }
                      quantity: { type: number }
                orderStatus:
                  type: [string, "null"]
                  description: v3 — the order's status after this return (net result of the sale and all returns).
                netEarnPoints: { type: [number, "null"], description: v3 — net points earned on the order. }
                netSpendPoints: { type: [number, "null"], description: v3 — net points spent on the order. }
                netLoyaltyDiscount: { type: [number, "null"], description: v3 — net loyalty discount on the order. }

    Event.PointsEarned:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: points.earned }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                customerId: { type: [string, "null"] }
                transactionId: { type: string }
                points: { type: number }
                campaignCode: { type: [string, "null"] }
                expiresAt: { type: [string, "null"], format: date-time }

    Event.PointsAdjusted:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: points.adjusted }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                customerId: { type: string }
                pointTransactionId: { type: string }
                amountRequested: { type: number }
                amountApplied: { type: number, description: Negative when points were removed. }
                balanceAfter: { type: number }
                reason: { type: [string, "null"] }
                adjustedAt: { type: string, format: date-time }

    Event.PointsExpiring:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: points.expiring }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                customerId: { type: string }
                points: { type: number, description: Total points that will expire in this reminder window. }
                earliestExpiry: { type: string, format: date-time }
                thresholdDays: { type: integer, description: "The reminder window, for example 30, 7 or 1 days." }
                lots: { type: integer, description: Number of point lots that will expire. }

    Event.PointsReleased:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: points.released }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                customerId: { type: string }
                transactionId: { type: string }
                orderNumber: { type: [string, "null"] }
                points: { type: number }
                releasedAt: { type: string, format: date-time }

    Event.PointsExpired:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: points.expired }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                customerId: { type: string }
                pointTransactionId: { type: string }
                expiredPoints: { type: number }
                expiredAt: { type: string, format: date-time }

    Event.VoucherIssued:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: voucher.issued }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                voucherId: { type: string }
                code: { type: string }
                voucherType: { type: string, description: "For example `AMOUNT`." }
                value: { type: number }
                status: { type: string }
                customerId: { type: [string, "null"] }
                issuedAt: { type: string, format: date-time }
                expiresAt: { type: [string, "null"], format: date-time }
                sourceCampaignId: { type: [string, "null"] }
                freeItemProductCode: { type: [string, "null"], description: Product code of a free-item voucher. }
                redeemedOrderNumber: { type: [string, "null"] }
                issuedOrderNumber: { type: [string, "null"], description: The order that earned the voucher. }
                batchId: { type: [string, "null"] }
                assignedAt: { type: [string, "null"], format: date-time }
                redeemedAt: { type: [string, "null"], format: date-time }
                partnerReference: { type: [string, "null"] }
                redeemedLocation: { type: [string, "null"] }
                redeemedAmount: { type: [number, "null"] }

    Event.VoucherRedeemed:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: voucher.redeemed }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                voucherId: { type: string }
                code: { type: string }
                voucherType: { type: string }
                value: { type: number }
                customerId: { type: [string, "null"] }
                orderNumber: { type: [string, "null"], description: The channel order the voucher was used in. }
                partnerReference: { type: [string, "null"], description: Set when the voucher was used at a partner. }
                location: { type: [string, "null"] }
                amount: { type: [number, "null"] }
                redeemedAt: { type: string, format: date-time }

    Event.VoucherRedemptionReversed:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: voucher.redemption_reversed }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                voucherId: { type: string }
                code: { type: string }
                customerId: { type: [string, "null"] }
                partnerReference: { type: string }
                reversedAt: { type: string, format: date-time }

    VoucherClosedData:
      type: object
      properties:
        voucherId: { type: string }
        code: { type: string }
        voucherType: { type: string }
        value: { type: number }
        customerId: { type: [string, "null"] }
        batchId: { type: [string, "null"] }
        closedAt: { type: string, format: date-time }

    Event.VoucherCancelled:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: voucher.cancelled }
            dataversion: { const: 1 }
            data:
              $ref: "#/components/schemas/VoucherClosedData"

    Event.VoucherExpired:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: voucher.expired }
            dataversion: { const: 1 }
            data:
              $ref: "#/components/schemas/VoucherClosedData"

    Event.MemberRegistered:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: member.registered }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                customerId: { type: string }
                customerCode: { type: [string, "null"] }
                enrollmentChannel: { type: [string, "null"] }
                registeredAt: { type: string, format: date-time }

    Event.MemberUpdated:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: member.updated }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                customerId: { type: string }
                changedFields:
                  type: array
                  description: Names (not values) of the changed profile fields.
                  items:
                    type: string
                    enum: [firstName, lastName, email, mobilePhone, phone, jobTitle, preferredContactMethod, address, city, birthDate, gender]
                updatedAt: { type: string, format: date-time }

    Event.ConsentChanged:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: consent.changed }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                customerId: { type: string }
                consentType: { type: string, description: "The permission: email, SMS, call or data sharing." }
                status: { type: string, description: "The new status, for example `REJECTED`." }
                source: { type: [string, "null"] }
                channel: { type: [string, "null"] }
                recordedAt: { type: string, format: date-time }

    Event.TierChanged:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: tier.changed }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                customerId: { type: string }
                fromCode: { type: [string, "null"], description: Previous tier code (`null` when joining a tier). }
                toCode: { type: [string, "null"], description: New tier code (`null` when the tier was lost). }
                fromName: { type: [string, "null"] }
                toName: { type: [string, "null"] }
                reason: { type: string, description: "For example `UPGRADE`." }
                changedAt: { type: string, format: date-time }

    Event.TierDowngradeScheduled:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: tier.downgrade_scheduled }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                customerId: { type: string }
                currentCode: { type: [string, "null"] }
                currentName: { type: [string, "null"] }
                expectedCode: { type: [string, "null"], description: The tier the member will move to. }
                expectedName: { type: [string, "null"] }
                downgradeAt: { type: string, format: date-time }

    Event.TierDowngradeCancelled:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: tier.downgrade_cancelled }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                customerId: { type: string }
                currentCode: { type: [string, "null"] }
                currentName: { type: [string, "null"] }
                cancelledAt: { type: string, format: date-time }

    Event.SegmentMembershipChanged:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: segment.membership_changed }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                customerId: { type: string }
                segmentCode: { type: string }
                change: { type: string, enum: [JOINED, LEFT] }
                changedAt: { type: string, format: date-time }

    Event.CampaignChanged:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: campaign.changed }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                campaignId: { type: string }
                code: { type: [string, "null"] }
                name: { type: [string, "null"] }
                status: { type: [string, "null"] }
                validFrom: { type: [string, "null"], format: date-time }
                validTo: { type: [string, "null"], format: date-time }
                change: { type: string, description: "What happened, for example `UPDATED`." }
                changedAt: { type: string, format: date-time }

    Event.JobCompleted:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: job.completed }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                jobId: { type: string }
                channelCode: { type: string }
                jobType: { type: string }
                totalRows: { type: integer }
                successRows: { type: integer }
                failedRows: { type: integer }

    Event.JobFailed:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: job.failed }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                jobId: { type: string }
                channelCode: { type: string }
                jobType: { type: string }
                errorMessage: { type: string }

    Event.WebhookTest:
      allOf:
        - $ref: "#/components/schemas/CloudEvent"
        - type: object
          properties:
            type: { const: webhook.test }
            dataversion: { const: 1 }
            data:
              type: object
              properties:
                message: { type: string, const: This is a test event. }

    # ---------------------------------------------------------------- Jobs

    JobStatus:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        status:
          type: string
          enum: [REQUESTED, PROCESSING, READY, FAILED]
          description: "`REQUESTED` → `PROCESSING` → `READY` or `FAILED`."
        jobType: { type: string }
        totalRows: { type: [integer, "null"], description: Row-level progress (jobs that are not row-oriented leave these `null` or 0). }
        processedRows: { type: [integer, "null"] }
        successRows: { type: [integer, "null"] }
        failedRows: { type: [integer, "null"] }
        rowErrorSamples:
          type: [array, "null"]
          items: { type: string }
          description: Up to 200 sample row-level error messages.
        errorMessage:
          type: [string, "null"]
          description: Set only when `status` is `FAILED` — the whole-job failure reason.
        result:
          type: [object, "null"]
          description: Set once `READY`; `null` otherwise.
          properties:
            available: { type: boolean }
            expiresAt: { type: [string, "null"], format: date-time }
            url: { type: string, description: Relative URL of the result endpoint. }
        createdAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
