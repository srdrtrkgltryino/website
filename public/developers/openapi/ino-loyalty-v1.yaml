        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

# ==================================================================== Webhooks (outgoing deliveries)

webhooks:
  transaction.completed:
    post:
      operationId: onTransactionCompleted
      tags: [Webhooks]
      summary: Purchase completed
      description: |
        A purchase was recorded and its points were earned or spent. Fired once per order. Version 2 adds the loyalty
        discount, store, tier, the voucher used, the value of points spent and the award of each campaign.
      parameters:
        - $ref: "#/components/parameters/webhookId"
        - $ref: "#/components/parameters/webhookTimestamp"
        - $ref: "#/components/parameters/webhookSignature"
        - $ref: "#/components/parameters/legacySignature"
        - $ref: "#/components/parameters/legacyTimestamp"
        - $ref: "#/components/parameters/legacyWebhookId"
        - $ref: "#/components/parameters/webhookUserAgent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event.TransactionCompleted"
            example:
              id: 5d2c9e8a-0000-4000-8000-0000000000a1
              source: ino-loyalty-api
              type: transaction.completed
              specversion: "1.0"
              time: "2026-11-03T14:30:00+00:00"
              subject: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
              dataversion: 2
              originchannel: MODERN_ECOM
              data:
                transactionId: b3a1d0c4-1e2f-4a5b-8c9d-0e1f2a3b4c5d
                customerId: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
                orderNumber: ORD-10482
                channel: ECOM
                originalSalePrice: 119.00
                finalSalePrice: 105.65
                totalEarnPoints: 104
                totalSpendPoints: 0
                transactionDate: "2026-11-03T14:30:00+00:00"
                loyaltyDiscount: 13.35
                storeCode: null
                tierCode: GOLD
                voucherCode: null
                voucherAmount: null
                spendPointsValue: null
                awards:
                  - { campaignId: a3d9c1e2-7b4f-4e0a-9c2d-5f6e7a8b9c0d, campaignCode: DENIM15, points: 0, discount: 13.35, voucher: false }
                  - { campaignId: c1b2a3d4-0000-4000-8000-000000000004, campaignCode: BASE_EARN, points: 104, discount: 0, voucher: false }
                pointsPendingUntil: null
      responses:
        "2XX":
          description: Acknowledge the delivery. Any other status (or a timeout after 10 seconds) is retried; `410 Gone` suspends the subscription.

  transaction.returned:
    post:
      operationId: onTransactionReturned
      tags: [Webhooks]
      summary: Return processed
      description: |
        Items of a purchase were returned: points earned on them are taken back and points spent on them are given back.
        Version 3 adds the order's net loyalty result after this return (status, points earned and spent, loyalty discount).
      parameters:
        - $ref: "#/components/parameters/webhookId"
        - $ref: "#/components/parameters/webhookTimestamp"
        - $ref: "#/components/parameters/webhookSignature"
        - $ref: "#/components/parameters/legacySignature"
        - $ref: "#/components/parameters/legacyTimestamp"
        - $ref: "#/components/parameters/legacyWebhookId"
        - $ref: "#/components/parameters/webhookUserAgent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event.TransactionReturned"
            example:
              id: 5d2c9e8a-0000-4000-8000-0000000000a2
              source: ino-loyalty-api
              type: transaction.returned
              specversion: "1.0"
              time: "2026-11-06T10:12:00+00:00"
              subject: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
              dataversion: 3
              originchannel: MODERN_ECOM
              data:
                transactionId: b3a1d0c4-1e2f-4a5b-8c9d-0e1f2a3b4c5d
                customerId: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
                orderNumber: ORD-10482
