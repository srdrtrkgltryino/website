  # ------------------------------------------------------------------ Returns

  /api/v1/{channelCode}/transaction.return.inquiry:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: transactionReturnInquiry
      tags: [Returns]
      summary: Preview a return (points)
      description: |
        Operation value `transaction.return.inquiry` of `POST /api/v1/{channelCode}/{operation}`.

        Previews the point impact of returning items, without committing anything. Returns `NOT_FOUND` if the order number
        is not known for your channel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnItemsRequest"
            example:
              requestId: 9a0b1c2d-3e4f-4a5b-8c6d-7e8f9a0b1c2d
              orderNumber: ORD-10482
              returnedItems:
                - { lineNumber: 2, sku: MR-TS-014, qty: 1 }
      responses:
        "200":
          description: Return preview.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnInquiryResponse"
              example:
                httpStatus: 200
                message: Success
                spentPointAmount: 0
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/{channelCode}/transaction.return.quote:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: transactionReturnQuote
      tags: [Returns]
      summary: Quote a return (refund breakdown)
      description: |
        Operation value `transaction.return.quote` of `POST /api/v1/{channelCode}/{operation}`. Available when enabled for
        your channel.

        A dry run that returns the full refund breakdown for returning items: the cash to refund, the discount that stops
        being valid when the remaining basket is re-priced, and the points given back and taken back. Nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnItemsRequest"
            example:
              requestId: 0b1c2d3e-4f5a-4b6c-9d7e-8f9a0b1c2d3e
              orderNumber: ORD-10483
              returnedItems:
                - { lineNumber: 1, sku: MR-DJ-001, qty: 1 }
      responses:
        "200":
          description: Refund breakdown.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnQuoteResponse"
              example:
                httpStatus: 200
                message: Success
                cashRefund: 74.17
                returnedGross: 89.00
                discountReversal: 7.35
                pointsValue: 7.48
                voucherValue: 0
                spendPointReversal: 75
                earnPointReversal: 74
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/{channelCode}/transaction.return.commit:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: transactionReturnCommit
      tags: [Returns]
      summary: Commit a return or cancellation
      description: |
        Operation value `transaction.return.commit` of `POST /api/v1/{channelCode}/{operation}`.

        Commits a return (`returnType: RETURN`, the default) or a cancellation (`CANCEL`). Points earned on the returned
        lines are taken back and points spent on them are given back. A committed return publishes a
        `transaction.returned` event. When enabled for your channel, the response also carries a `refund` breakdown with
        the same fields as `transaction.return.quote`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnCommitRequest"
            example:
              requestId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
              orderNumber: ORD-10482
              returnedItems:
                - { lineNumber: 2, sku: MR-TS-014, qty: 1 }
              returnType: RETURN
      responses:
        "200":
          description: The return was recorded.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReturnCommitResponse"
              example:
                httpStatus: 200
                message: Success
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

