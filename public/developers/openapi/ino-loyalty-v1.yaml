      tags: [Vouchers]
      summary: Check a voucher code
      description: |
        Operation value `voucher.validate` of `POST /api/v1/{channelCode}/{operation}`.

        Checks whether a voucher code is usable. Does not use the voucher.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoucherValidateRequest"
            example:
              requestId: 7d8e9f0a-1b2c-4d3e-8f4a-5b6c7d8e9f0a
              code: SAVE10-7KQ2P
              customerId: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
      responses:
        "200":
          description: Validation result.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoucherValidateResponse"
              example:
                httpStatus: 200
                message: Success
                isValid: true
                voucherMessage: null
                voucherType: AMOUNT
                value: 10.00
        "400": { $ref: "#/components/responses/BadRequest" }
