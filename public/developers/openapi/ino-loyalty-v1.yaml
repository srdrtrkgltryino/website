      operationId: webhookUnsubscribe
      tags: [Webhooks]
      summary: Unsubscribe
      description: |
        Removes a subscription by `url` or `subscriptionId`. Idempotent — calling it again, or with an unknown URL, still
        returns success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnsubscribeRequest"
