                      status: ACTIVE
                      state: ACTIVE
                      createdAt: "2026-11-03T14:30:00+00:00"
                      originChannels: []
                      storeIds: []
                Warnings: []
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/{channelCode}/webhooks/subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/subscriptionId"
      - $ref: "#/components/parameters/correlationId"
    get:
      operationId: getWebhookSubscription
      tags: [Webhooks]
      summary: Get a subscription
      description: Returns one subscription (without the secret). Signed over an empty body.
      responses:
        "200":
          description: The subscription.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      Data:
                        $ref: "#/components/schemas/WebhookSubscription"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      operationId: updateWebhookSubscription
      tags: [Webhooks]
      summary: Update, pause or resume a subscription
      description: |
        Changes `url`, `eventTypes`, `status`, `originChannels` and/or `storeIds`. Omitted fields stay unchanged.
        Set `status` to `PAUSED` to pause delivery (events keep queuing while paused) and to `ACTIVE` to resume.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPatchRequest"
            examples:
              pause:
                summary: Pause delivery
                value: { status: PAUSED }
              changeEvents:
                summary: Change the event filter
                value: { eventTypes: [transaction.completed, transaction.returned] }
      responses:
        "200":
          description: The updated subscription.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      Data:
                        type: object
                        properties:
                          subscription:
                            $ref: "#/components/schemas/WebhookSubscription"
                          warnings:
                            $ref: "#/components/schemas/EventTypeWarnings"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteWebhookSubscription
      tags: [Webhooks]
      summary: Delete a subscription
      description: |
        Deletes the subscription. Idempotent — deleting an unknown or already deleted subscription also returns **204**.
        This is the call an automation platform makes when its flow is removed. Signed over an empty body.
      responses:
        "204":
          description: Deleted (or did not exist).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/{channelCode}/webhooks/subscriptions/{id}/test:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/subscriptionId"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: testWebhookSubscription
      tags: [Webhooks]
      summary: Send a test event
      description: |
        Sends a `webhook.test` event straight to this subscription (bypassing the queue), signed exactly like real
        deliveries, and returns whether it was delivered. Use it right after subscribing to confirm your endpoint and
        signature verification work. Send `{}` as the body.
      requestBody:
        $ref: "#/components/requestBodies/EmptyObject"
      responses:
        "200":
          description: Test delivery result.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      Data:
                        $ref: "#/components/schemas/TestDeliveryResult"
              example:
                ResponseCode: SUCCESS
                ResponseCodeValue: 1200
                ResponseMessage: Success
                RequestId: 5b4c3d2e-1f0a-4988-b776-655443322111
                Data: { sent: true, httpStatus: 200, durationMs: 182, error: null }
                Warnings: []
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/{channelCode}/webhooks/subscriptions/{id}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/subscriptionId"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: rotateWebhookSecret
      tags: [Webhooks]
      summary: Rotate the signing secret
      description: |
        Issues a new signing secret (shown once). The previous secret stays valid for **24 hours**: during that time the
        `webhook-signature` header carries two signatures (new and previous secret) — accept the request if any of them
        matches. Send `{}` as the body.
      requestBody:
        $ref: "#/components/requestBodies/EmptyObject"
      responses:
        "200":
          description: The new secret.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      Data:
                        type: object
                        properties:
                          secret:
                            type: string
                            description: The new signing secret (`whsec_` followed by base64). Store it immediately.
                          previousValidUntil:
                            type: string
                            format: date-time
                            description: Until when the previous secret is still accepted.
              example:
                ResponseCode: SUCCESS
                ResponseCodeValue: 1200
                ResponseMessage: Success
                RequestId: 6c5d4e3f-2a1b-4099-8887-766554433222
                Data:
                  secret: whsec_examplesecret
                  previousValidUntil: "2026-11-04T14:30:00+00:00"
                Warnings: []
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ------------------------------------------------------------------ Webhooks (original endpoints)

  /api/v1/{channelCode}/webhooks/subscribe:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: webhookSubscribe
      tags: [Webhooks]
      summary: Subscribe (create or update)
      description: |
        Creates a subscription, or — when called again with the **same `url`** — updates its `eventTypes` and reactivates a
        suspended subscription (this is how you resume delivery after fixing your endpoint).

        The response includes `secret` **only** on first creation, or when you pass `rotateSecret: true` (which invalidates
        the old secret). Store it immediately — it is never shown again. `eventTypes` omitted or `[]` means all event types.
        New integrations should prefer `POST /webhooks/subscriptions`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeRequest"
            example:
              url: https://hooks.example.com/ino-loyalty
              eventTypes: [points.earned, voucher.issued]
      responses:
        "200":
          description: Subscription created or updated.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      Data:
                        $ref: "#/components/schemas/SubscribeResult"
              example:
                ResponseCode: SUCCESS
                ResponseCodeValue: 1200
                ResponseMessage: Success
                RequestId: 7d6e5f4a-3b2c-41aa-9998-877665544333
                Data:
                  subscriptionId: 0f1e2d3c-4b5a-4968-8776-655443322110
                  url: https://hooks.example.com/ino-loyalty
                  eventTypes: [points.earned, voucher.issued]
                  secretRotated: true
                  secret: whsec_examplesecret
                  warnings: []
                Warnings: []
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/{channelCode}/webhooks/unsubscribe:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
