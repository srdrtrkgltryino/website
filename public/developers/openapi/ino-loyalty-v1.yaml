  # ------------------------------------------------------------------ Customers

  /api/v1/{channelCode}/customer.get360:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: customerGet360
      tags: [Customers]
      summary: Look up a customer
      description: |
        Operation value `customer.get360` of `POST /api/v1/{channelCode}/{operation}`.

        Returns a customer's profile, point balance, segments and contact permissions. Identify the customer by one of
        `customerCode`, `mobilePhone` or `cardNumber`.

        `walletPassUrl` (when Apple Wallet is enabled) is a **relative** path; prefix it with the API base URL. Opening it
        on an iPhone in Safari adds the card to Wallet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerGet360Request"
            example:
              requestId: 4c3b2a1d-9e8f-4a7b-b6c5-d4e3f2a1b0c9
              customerCode: C-000245
      responses:
        "200":
          description: The customer's profile.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerGet360Response"
              example:
                httpStatus: 200
                message: Success
                customerId: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
                customerCode: C-000245
                fullName: Emma Clark
                cardNumber: "6001000002451"
                cardStatus: ACTIVE
                pointBalance: 1740
                lifetimePointEarned: 3260
                segments: [VIP, DENIM_LOVERS]
                smsPermission: true
                emailPermission: true
                walletPassUrl: /wallet/apple/pass/6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/{channelCode}/customer.create:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: customerCreate
      tags: [Customers]
      summary: Register a customer directly
      description: |
        Operation value `customer.create` of `POST /api/v1/{channelCode}/{operation}`.

        Registers a customer without SMS verification. **`mobilePhone` is required** — omitting it returns
        `400 Phone number is required`. If SMS verification is enabled in your program settings, the call does not create
        the member and returns `needsVerification: true`; use `customer.register.initiate` / `.confirm` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreateRequest"
            example:
              requestId: 8e7d6c5b-4a39-4b28-9c17-0d6e5f4a3b2c
              fullName: Emma Clark
              mobilePhone: "+15555550142"
              email: emma.clark@example.com
              assignVirtualCard: true
      responses:
        "200":
          description: The customer was created (or already existed).
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerCreateResponse"
              example:
                httpStatus: 200
                message: Success
                customerId: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
                cardNumber: "6001000002451"
                needsVerification: false
                verificationId: null
                maskedPhone: null
                alreadyExisted: false
                cardWarning: null
                walletPassUrl: /wallet/apple/pass/6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/{channelCode}/customer.register.initiate:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: customerRegisterInitiate
      tags: [Customers]
      summary: Start SMS-verified registration
      description: |
        Operation value `customer.register.initiate` of `POST /api/v1/{channelCode}/{operation}`.

        Starts SMS-verified registration. When `needsVerification` is `true`, an SMS code is sent to the customer; complete
        the registration with `customer.register.confirm`, passing the returned `verificationId` and the code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInitiateRequest"
            example:
              requestId: 3a4b5c6d-7e8f-4a9b-8c0d-1e2f3a4b5c6d
              firstName: Emma
              lastName: Clark
              mobilePhone: "+15555550142"
              email: emma.clark@example.com
              assignVirtualCard: true
      responses:
        "200":
          description: Verification started (or the customer already existed).
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterInitiateResponse"
              example:
                httpStatus: 200
                message: Success
                needsVerification: true
                verificationId: 5e6f7a8b-9c0d-4e1f-a2b3-c4d5e6f7a8b9
                maskedPhone: "+1555*****42"
                alreadyExisted: false
                customerId: null
                customerCode: null
                cardNumber: null
                cardWarning: null
                walletPassUrl: null
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /api/v1/{channelCode}/customer.register.confirm:
    parameters:
      - $ref: "#/components/parameters/channelCode"
      - $ref: "#/components/parameters/correlationId"
    post:
      operationId: customerRegisterConfirm
      tags: [Customers]
      summary: Complete SMS-verified registration
      description: |
        Operation value `customer.register.confirm` of `POST /api/v1/{channelCode}/{operation}`.

        Completes SMS-verified registration with the `verificationId` from `customer.register.initiate` and the code the
        customer received.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterConfirmRequest"
            example:
              requestId: 6b7c8d9e-0f1a-4b2c-9d3e-4f5a6b7c8d9e
              verificationId: 5e6f7a8b-9c0d-4e1f-a2b3-c4d5e6f7a8b9
              code: "482913"
      responses:
        "200":
          description: The customer was registered.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/X-Correlation-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterConfirmResponse"
              example:
                httpStatus: 200
                message: Success
                customerId: 6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
                customerCode: C-000245
                cardNumber: "6001000002451"
                cardWarning: null
                walletPassUrl: /wallet/apple/pass/6f0c2b1e-8a54-4d2e-9b9e-2f1d7c3a4b10
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/Unavailable" }

